<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>ROCK PAPER SCISSOR</h2>
    <div class="outer-container">
        <div class="container">
            <img src="/img/rock.png" alt="" class="images" id="rock">
            <img src="/img/paper.png" alt="" class="images" id="paper">
            <img src="/img/scissor.png" alt="" class="images" id="scissor">
        </div>
        <div class="score-board">
            <div class="scores">
                <p id="your-score">0</p>
                <p>Your Score</p>
            </div>
            <div class="scores">
                <p id="comp-score">0</p>
                <p>Computer Score</p>
            </div>
        </div>
        <p id="message">Select Your Move</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
